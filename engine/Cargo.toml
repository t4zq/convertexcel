[package]
name = "convertexcel-engine"
version = "0.1.0"
edition = "2021"
description = "converTeXcel statistics engine compiled to WebAssembly"
license = "MIT"
repository = "https://github.com/t4zq/convertexcel"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
