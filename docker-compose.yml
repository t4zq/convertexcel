services:
  # ── Rust → WASM 計算エンジン (ワンショット・ビルド) ───────────
  # 出力を frontend/src/engine/pkg に書き出し、フロントが静的読込する。
  engine:
    build: ./engine
    working_dir: /workspace/engine
    volumes:
      - ./engine:/workspace/engine
      - ./frontend/src/engine/pkg:/workspace/pkg
      - cargo-registry:/usr/local/cargo/registry
    command: >
      wasm-pack build /workspace/engine --target web
      --out-dir /workspace/pkg

  # ── Rails API ────────────────────────────────────────────────
  api:
    build: ./api
    working_dir: /app
    volumes:
      - ./api:/app
    environment:
      RAILS_ENV: development
    ports:
      - "3000:3000"

  # ── フロント (Vite dev server) ───────────────────────────────
  frontend:
    image: node:24-bookworm
    working_dir: /app
    volumes:
      - ./frontend:/app
      # コンテナ専用 node_modules (ホストの Windows バイナリと混ざらないように)
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      engine:
        condition: service_completed_successfully

volumes:
  cargo-registry:
