name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Check engine
        working-directory: engine
        run: cargo check

      - name: Test engine
        working-directory: engine
        run: cargo test

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build engine WASM
        working-directory: engine
        run: wasm-pack build --target web --out-dir ../frontend/src/engine/pkg

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Excel add-in
        working-directory: frontend
        run: npm run build:addin

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck worker
        run: npm run typecheck:worker
